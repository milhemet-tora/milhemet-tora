name: Build articles

# Runs when the CMS (or anyone) changes an article source file, then commits the generated pages.
on:
  push:
    branches: [main]
    paths:
      - "content/articles/**"
      - "content/videos/**"
      - "scripts/build-articles.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-articles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build articles
        run: npm run build:articles

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts index.html scripts/generated.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build site from CMS content"
            git pull --rebase
            git push
          fi
