# Decap CMS configuration. Full reference: https://decapcms.org/docs/configuration-options/

local_backend: true

backend:
  name: github
  repo: milhemet-tora/milhemet-tora
  branch: main
  base_url: https://auth.milhemet-tora.com
  auth_endpoint: auth

# Commit straight to the branch. Switch to `editorial_workflow` for draft review.
publish_mode: simple

# Uploaded images go here. The build script rewrites "/assets/..." for article pages.
media_folder: assets/uploads
public_folder: /assets/uploads

locale: he

collections:
  - name: articles
    label: מאמרים
    label_singular: מאמר
    folder: content/articles
    create: true
    extension: md
    format: frontmatter
    # File name = url_slug, so the Hebrew title does not have to be transliterated.
    slug: "{{fields.url_slug}}"
    identifier_field: title
    summary: "{{title}} · {{category}}"
    sortable_fields: [title, date, category]
    fields:
      - label: כותרת
        name: title
        widget: string

      - label: כתובת הדף (באנגלית)
        name: url_slug
        widget: string
        pattern: ['^[a-z0-9-]+$', 'רק אותיות אנגליות קטנות, ספרות ומקפים']
        hint: 'לדוגמה: rambam-and-tzedaka. זה יהיה שם הקובץ בכתובת הדף.'

      - label: קטגוריה
        name: category
        widget: select
        options:
          - { label: מסות, value: essays }
          - { label: הלכה ורמב"ם, value: halacha-and-rambam }
          - { label: קבלה וזוהר, value: kabbalah-and-zohar }
          - { label: היתר הנאה, value: heter-hanaah }
          - { label: פרשנות המקרא, value: bible-commentary }
          - { label: לא מסווג, value: unsorted }

      - label: כותב
        name: author
        widget: select
        options:
          - { label: דוד, value: david }
          - { label: רפי, value: rafi }
          - { label: אנונימי, value: anonymous }
        hint: 'דוד ורפי: המאמר יופיע תחת המאמרים שלהם בדף המאמרים. אנונימי: המאמר יופיע תחת "מאמרים נוספים".'

      - label: תיאור קצר
        name: description
        widget: text
        required: false
        hint: 'מופיע ברשימת המאמרים. משפט אחד.'

      - label: תאריך פרסום
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        default: now

      - label: טיוטה (לא לפרסם)
        name: draft
        widget: boolean
        default: false
        hint: 'כשמסומן, המאמר לא ייבנה לאתר.'

      - label: תוכן המאמר
        name: body
        widget: markdown

  - name: videos
    label: סרטונים
    label_singular: סרטון
    folder: content/videos
    create: true
    extension: md
    format: frontmatter
    # Video files have no public address, so name them by date and time.
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}-{{second}}"
    identifier_field: title
    summary: "{{title}} · {{category}}"
    sortable_fields: [title, date, category]
    # One list, grouped by the five columns of the home page (colours are set in admin/index.html).
    view_groups:
      - label: עמודה בעמוד הראשי
        field: category
    fields:
      - label: כותרת
        name: title
        widget: string

      - label: קישור ליוטיוב
        name: url
        widget: string
        hint: 'הדביקו את הקישור מיוטיוב. קישור לפלייליסט (עם list=) יפעיל את הפלייליסט.'

      - label: קטגוריה (עמודה בעמוד הראשי)
        name: category
        widget: select
        options:
          - { label: בגנות ההיתר להתפרנס מהתורה, value: col-1 }
          - { label: איוולת הפסיקה השכירה, value: col-2 }
          - { label: בדיית הזוהר וה"קבלה", value: col-3 }
          - { label: בירור מושגים, value: col-4 }
          - { label: המלך עירום!, value: col-5 }

      - label: תאריך
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        default: now

      - label: טיוטה (לא לפרסם)
        name: draft
        widget: boolean
        default: false
        hint: 'כשמסומן, הסרטון לא יופיע בעמוד הראשי.'
