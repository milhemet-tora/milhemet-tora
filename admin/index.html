<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="noindex, nofollow" name="robots"/>
<title>ניהול מאמרים · מלחמת תורה</title>
<script>
  // Video list in the panel: colour each video by its column, as on the home page.
  // Only styles are changed, never text, because Decap's React code owns the text.
  (function () {
    var COLOURS = {
      "col-1": "#e8a0a0",
      "col-2": "#f2c75c",
      "col-3": "#8fc188",
      "col-4": "#7fb0de",
      "col-5": "#e0716b",
    };
    function paint(el, colour) {
      el.style.background = colour + "33";
      el.style.borderInlineStart = "6px solid " + colour;
    }
    function tint() {
      // Rows in the video list: the card (li) around each video link ends with "· col-N".
      document.querySelectorAll('a[href*="/collections/videos/entries/"]').forEach(function (a) {
        var m = a.textContent.match(/·\s*(col-[1-5])\s*$/);
        if (m) paint(a.closest("li") || a, COLOURS[m[1]]);
      });
      // Group headers, when the list is grouped by category: a leaf element that reads "col-N".
      document.querySelectorAll("body *").forEach(function (el) {
        if (el.children.length || el.dataset.column) return;
        var g = el.textContent.trim().match(/^(?:.*:\s*)?(col-[1-5])$/);
        if (!g) return;
        el.dataset.column = g[1];
        paint(el, COLOURS[g[1]]);
      });
    }
    // The panel renders after this page loads and again on every change, so watch the page.
    new MutationObserver(tint).observe(document.documentElement, { childList: true, subtree: true });
  })();
</script>
<!-- favicon:start -->
<link href="../favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="../favicon.ico" rel="alternate icon" sizes="any"/>
<link href="../apple-touch-icon.png" rel="apple-touch-icon"/>

<style>
  /* Dark mode for the Decap panel: invert the whole page and re-invert media so pictures keep their colours. */
  html[data-theme="dark"] { filter: invert(0.9) hue-rotate(180deg); background: #fff; }
  html[data-theme="dark"] img, html[data-theme="dark"] video { filter: invert(1) hue-rotate(180deg); }
  #admin-toolbar, #admin-toolbar * { font-family: Heebo, system-ui, sans-serif; }
  #admin-toolbar {
    position: fixed; bottom: 16px; inset-inline-start: 16px; z-index: 2147483000;
    display: flex; gap: 8px; direction: rtl;
  }
  #admin-toolbar a, #admin-toolbar button {
    font: 600 14px/1 Heebo, system-ui, sans-serif; padding: 10px 14px; border-radius: 8px;
    border: 1px solid #b9b2a3; background: #fff; color: #222; cursor: pointer;
    text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  #admin-toolbar a:hover, #admin-toolbar button:hover { background: #f3efe6; }
  /* Toolbar sits above the inverted page, so cancel the inversion on it. */
  html[data-theme="dark"] #admin-toolbar { filter: invert(1) hue-rotate(180deg); }
</style>
<script>
  // Apply the saved theme before the panel loads, so there is no flash of light mode.
  (function () {
    try {
      if (localStorage.getItem("admin-theme") === "dark") document.documentElement.dataset.theme = "dark";
    } catch (e) {}
  })();
</script>
</head>
<body>
<!-- Decap CMS admin. Config: admin/config.yml. Setup: CMS-SETUP.md -->
<script>
  // Register preview styles before Decap starts, so the editor preview looks like the article page.
  window.CMS_MANUAL_INIT = true;
</script>
<script src="https://unpkg.com/decap-cms@3.17.1/dist/decap-cms.js"></script>
<script>
  CMS.registerPreviewStyle(new URL("../assets/article.css", location.href).href);
  CMS.registerPreviewStyle(
    "body { direction: rtl; text-align: right; font-family: Heebo, system-ui, sans-serif; line-height: 1.7; padding: 16px; }",
    { raw: true }
  );
  CMS.init();
</script>
<div id="admin-toolbar">
  <a href="stats.html">סטטיסטיקות</a>
  <button id="theme-toggle" type="button">מצב כהה</button>
</div>
<script>
  (function () {
    var btn = document.getElementById("theme-toggle");
    function label() {
      btn.textContent = document.documentElement.dataset.theme === "dark" ? "מצב בהיר" : "מצב כהה";
    }
    btn.addEventListener("click", function () {
      var dark = document.documentElement.dataset.theme !== "dark";
      if (dark) document.documentElement.dataset.theme = "dark";
      else delete document.documentElement.dataset.theme;
      try { localStorage.setItem("admin-theme", dark ? "dark" : "light"); } catch (e) {}
      label();
    });
    label();
  })();
</script>
</body>
</html>
